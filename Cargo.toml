[package]
name = "skillcask"
version = "0.10.5"
edition = "2024"
rust-version = "1.89"
description = "A lockfile-first package manager for AI agent skills (SKILL.md), backed by Composer repositories"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GetResponse/skillcask"
homepage = "https://github.com/GetResponse/skillcask"
readme = "README.md"
keywords = ["skills", "agents", "claude", "lockfile", "package-manager"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/tests", "/docs", "/macos"]

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false }
hex = "0.4.3"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
jiff = "0.2.38"
percent-encoding = "2.3.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml_edit = "0.25.17"
ureq = { version = "3.4.2", features = ["platform-verifier"] }
url = "2.5.8"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

# Release builds made by cargo-dist.
[profile.dist]
inherits = "release"
lto = "thin"
