#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # Hand edit: the installer is checked against a pinned sha256 (it checks the tarball it
        # fetches), and no token is in the environment while it runs.
        shell: bash
        env:
          GH_TOKEN: ""
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf -o dist-installer.sh https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh
          echo "b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5  dist-installer.sh" | sha256sum -c -
          sh dist-installer.sh
      - name: Cache dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    permissions:
      "attestations": "write"
      "contents": "read"
      "id-token": "write"
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        env:
          GH_TOKEN: ""
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        env:
          GH_TOKEN: ""
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "target/distrib/*${{ join(matrix.targets, ', ') }}*"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  publish-homebrew-formula:
    needs:
      - plan
      - host
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          repository: "GetResponse/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # So we have access to the formula
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # This is extra complex because you can make your Formula name not match your app name
      # so we need to find releases with a *.rb file, and publish with that filename.
      - name: Commit formula files
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name=$(echo "$filename" | sed "s/\.rb$//")
            version=$(echo "$release" | jq .app_version --raw-output)

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push

  publish-npm:
    needs:
      - plan
      - host
    runs-on: "ubuntu-22.04"
    # npm trusted publishing (OIDC): no NPM_TOKEN, provenance attached automatically.
    permissions:
      "contents": "read"
      "id-token": "write"
    env:
      PLAN: ${{ needs.plan.outputs.val }}
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    steps:
      - name: Fetch npm packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true
      # No registry-url: setup-node would then export a placeholder NODE_AUTH_TOKEN that npm sends
      # instead of exchanging the OIDC token, and the publish fails with E404.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      # An exact npm, at least 3 days old (supply chain cooldown); trusted publishing needs >= 11.5.1.
      - run: npm install -g npm@11.21.1 && npm --version
      - run: |
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            npm publish --access public "./npm/${pkg}"
          done

  # Hand edit: the macOS app with the released CLI inside, signed with a Developer ID, notarized and
  # attached to the release (docs/specs/2026-10-28-macos-app-release.md). It runs for pre-releases
  # too. The signing secrets live in the `release` environment, which waits for a reviewer and only
  # deploys from `v*` tags.
  publish-macos-app:
    needs:
      - plan
      - host
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      "contents": "write"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Xcode CI's macos-app job passes on.
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Fetch the released CLI
        run: |
          cli="$RUNNER_TEMP/cli"
          mkdir -p "$cli" && cd "$cli"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'skillcask-*-apple-darwin.tar.xz*'
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            shasum -a 256 -c "skillcask-$target.tar.xz.sha256"
            tar -xJf "skillcask-$target.tar.xz"
          done
          lipo -create -output skillcask skillcask-aarch64-apple-darwin/skillcask skillcask-x86_64-apple-darwin/skillcask
      - name: Import the signing certificate
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        # `security import`, not OpenSSL: Keychain exports the .p12 with RC2-40, which OpenSSL 3+ reads
        # only with -legacy.
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kp=$(openssl rand -hex 16)
          (umask 077 && echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12")
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build and sign
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: SKILLCASK_CLI="$RUNNER_TEMP/cli/skillcask" macos/bundle.sh
      - name: Notarize and staple
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/key.p8"
          (umask 077 && echo "$P8" | base64 --decode > "$key")
          cd macos/.build
          zip=$(ls Skillcask-*-macos-universal.zip)
          # --wait exits 0 on an Invalid submission too, so the status decides.
          xcrun notarytool submit "$zip" --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          if [ "$(jq -r .status "$RUNNER_TEMP/notary.json")" != Accepted ]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER" || true
            exit 1
          fi
          xcrun stapler staple Skillcask.app
          xcrun stapler validate Skillcask.app
          spctl -a -vv Skillcask.app 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"
          # bundle.sh zipped the app before the staple, so that zip carries no ticket.
          rm "$zip"
          ditto -c -k --keepParent Skillcask.app "$zip"
          shasum -a 256 -b "$zip" > "$zip.sha256"
      - name: Attach to the release
        run: |
          cp macos/install-app.sh "$RUNNER_TEMP/skillcask-app-installer.sh"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" macos/.build/Skillcask-*-macos-universal.zip* "$RUNNER_TEMP/skillcask-app-installer.sh"
      - name: Remove the keychain and the API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/key.p8" "$RUNNER_TEMP/cert.p12"

  # Hand edit: the installer package for device-managed Macs (Jamf, AutoPkg): the app
  # publish-macos-app released, for /Applications, and a link to its CLI for /usr/local/bin, signed
  # with a Developer ID Installer certificate, notarized and attached to the release. A job of its
  # own, so that it compiles nothing, never holds the Developer ID Application certificate, waits for
  # its own review, and can fail or be rerun alone: nothing needs it, so the zip, the cask, the
  # formula, npm and the announcement never wait for the package. Like the app job it runs for
  # pre-releases too and is skipped on pull requests, where `host` and so publish-macos-app are.
  publish-macos-pkg:
    needs:
      - plan
      - publish-macos-app
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    permissions:
      "contents": "write"
    # GH_TOKEN only on the steps that call gh: it is not in the environment while code from the tag
    # runs (pkg.sh runs the released CLI's --version, check-pkg.sh --install the installed CLI).
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    # The default shell, `bash -e` without pipefail, on purpose: `has` below pipes into `grep -q`,
    # which may exit before its writer does.
    steps:
      # A published package is never replaced: administrators may already have fetched it, and its
      # checksum may be pinned. `state` is one of:
      #   complete  package and checksum are on the release and agree: nothing left to do
      #   sidecar   only the package is there (a run stopped between the two uploads): the
      #             package is verified below and only its checksum is written and attached
      #   build     neither is there: build, sign, notarize and attach both
      # Anything else (an interrupted upload, a checksum that does not match, a checksum without a
      # package) fails and is left for a maintainer. No upload in this job uses --clobber.
      - name: Look for an already published package
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg="Skillcask-${TAG#v}-macos-universal.pkg"
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets)
          # Only finished uploads count: an interrupted one stays on the release in another state.
          assets=$(printf '%s\n' "$release" | jq -r '.assets[] | select(.state == "uploaded") | .name')
          unfinished=$(printf '%s\n' "$release" | jq -r '.assets[] | select(.state != "uploaded") | .name')
          has() { printf '%s\n' "$assets" | grep -Fxq "$1"; }
          for name in "$pkg" "$pkg.sha256"; do
            if printf '%s\n' "$unfinished" | grep -Fxq "$name"; then
              echo "::error::the upload of $name did not finish; delete $name from the release, then rerun"
              exit 1
            fi
          done
          if ! has "$pkg"; then
            if has "$pkg.sha256"; then
              echo "::error::the release has $pkg.sha256 but no $pkg; delete $pkg.sha256 from the release, then rerun"
              exit 1
            fi
            echo "state=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/published" && cd "$RUNNER_TEMP/published"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$pkg*"
          if [ -f "$pkg.sha256" ]; then
            if ! shasum -a 256 -c "$pkg.sha256"; then
              echo "::error::the released $pkg does not match $pkg.sha256; nothing was replaced. Delete $pkg.sha256 (and $pkg too if the package is the wrong one) from the release, then rerun"
              exit 1
            fi
            echo "installer package already published: $pkg" >> "$GITHUB_STEP_SUMMARY"
            echo "state=complete" >> "$GITHUB_OUTPUT"
          else
            echo "PKG_DIR=$RUNNER_TEMP/published" >> "$GITHUB_ENV"
            echo "state=sidecar" >> "$GITHUB_OUTPUT"
          fi
      # A missing package must fail loudly, never be skipped: AutoPkg silently falls back to an
      # older release when the newest one has no matching asset. So every secret this job reads
      # must be set before it does any work. A rerun that finds the package complete reads none.
      - name: Check the signing secrets
        if: steps.state.outputs.state != 'complete'
        env:
          MACOS_INSTALLER_CERTIFICATE_P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          missing=0
          for name in MACOS_INSTALLER_CERTIFICATE_P12 MACOS_INSTALLER_CERTIFICATE_PASSWORD \
            MACOS_INSTALLER_SIGN_IDENTITY APP_STORE_CONNECT_API_KEY_P8 APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::the secret $name is not set in the GitHub environment 'release'; set it there, then rerun this job"
              missing=1
            fi
          done
          [ "$missing" = 0 ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.state.outputs.state != 'complete'
        with:
          persist-credentials: false
      # The Xcode publish-macos-app and CI's macos-pkg job use: stapler, notarytool and lipo come
      # from it.
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
        if: steps.state.outputs.state != 'complete'
      # Also for a package found without its checksum: the installed app is compared with this one.
      - name: Fetch the released app
        if: steps.state.outputs.state != 'complete'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          zip="Skillcask-$version-macos-universal.zip"
          mkdir -p "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$zip*"
          shasum -a 256 -c "$zip.sha256"
          ditto -x -k "$zip" .
          xcrun stapler validate Skillcask.app
          spctl -a -vv Skillcask.app 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -qxF 'Skillcask.app: accepted' "$RUNNER_TEMP/spctl.txt"
          grep -qx 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Skillcask.app/Contents/Info.plist)
          if [ "$app_version" != "$version" ]; then
            echo "::error::the released app is $app_version, the tag is $TAG"
            exit 1
          fi
      - name: Import the installer certificate
        if: steps.state.outputs.state == 'build'
        env:
          P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
        # The same sequence as in publish-macos-app, for productbuild (pkg.sh signs with
        # `productbuild --sign`), with the private key imported non-extractable (-x).
        run: |
          kc="$RUNNER_TEMP/installer.keychain-db"
          kp=$(openssl rand -hex 16)
          (umask 077 && echo "$P12" | base64 --decode > "$RUNNER_TEMP/installer.p12")
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/installer.p12" -k "$kc" -f pkcs12 -P "$P12_PASSWORD" -x -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/installer.p12"
          # Counted, not printed.
          found=$(security find-identity -v -p basic "$kc" | grep -c 'Developer ID Installer' || true)
          if [ "$found" != 1 ]; then
            echo "::error::expected exactly one Developer ID Installer identity in the keychain, found $found"
            exit 1
          fi
          # This job never holds the certificate that signs apps. find-certificate exits 0 when
          # nothing matches, so its output decides.
          if [ -n "$(security find-certificate -a -c 'Developer ID Application' "$kc")" ]; then
            echo "::error::MACOS_INSTALLER_CERTIFICATE_P12 holds a Developer ID Application certificate; export the Developer ID Installer certificate alone"
            exit 1
          fi
      - name: Build and sign the package
        if: steps.state.outputs.state == 'build'
        env:
          IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
        # The keychain goes when this step ends, failed or not: signing is done, and notarization
        # uses only the API key. delete-keychain also takes it off the search list.
        run: |
          trap 'security delete-keychain "$RUNNER_TEMP/installer.keychain-db" || true' EXIT
          # pkg.sh leaves the package unsigned when the identity is empty.
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_INSTALLER_SIGN_IDENTITY is not set in the release environment"
            exit 1
          fi
          SKILLCASK_APP="$RUNNER_TEMP/app/Skillcask.app" INSTALLER_IDENTITY="$IDENTITY" \
            INSTALLER_KEYCHAIN="$RUNNER_TEMP/installer.keychain-db" macos/pkg.sh
          # The version pkg.sh put in the file name is the tag's.
          pkg="Skillcask-${TAG#v}-macos-universal.pkg"
          if [ ! -f "macos/.build/$pkg" ]; then
            ls macos/.build
            echo "::error::pkg.sh did not write $pkg: its version is not the tag's"
            exit 1
          fi
          echo "PKG_DIR=$GITHUB_WORKSPACE/macos/.build" >> "$GITHUB_ENV"
      - name: Notarize and staple
        if: steps.state.outputs.state == 'build'
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/key.p8"
          trap 'rm -f "$key"' EXIT
          (umask 077 && echo "$P8" | base64 --decode > "$key")
          cd "$PKG_DIR"
          pkg="Skillcask-${TAG#v}-macos-universal.pkg"
          # --wait exits 0 on an Invalid submission too, and non-zero on a timeout or a network
          # error, so the status decides either way.
          xcrun notarytool submit "$pkg" --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          status=$(jq -r '.status // empty' "$RUNNER_TEMP/notary.json" || true)
          id=$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json" || true)
          if [ "$status" != Accepted ]; then
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER" || true
            fi
            echo "::error::notarization did not succeed (status: ${status:-none}, submission: ${id:-none})"
            exit 1
          fi
          rm -f "$key"
          xcrun stapler staple "$pkg"
      # Also for a package found on the release without its checksum (state `sidecar`): it gets a
      # checksum only when this release's installer identity signed it.
      - name: Verify the package and write the checksum
        if: steps.state.outputs.state != 'complete'
        env:
          IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
        run: |
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_INSTALLER_SIGN_IDENTITY is not set in the release environment"
            exit 1
          fi
          cd "$PKG_DIR"
          pkg="Skillcask-${TAG#v}-macos-universal.pkg"
          xcrun stapler validate "$pkg"
          # The leaf's name is the secret MACOS_INSTALLER_SIGN_IDENTITY, so the log shows it (here, in
          # spctl's origin= and in pkg.sh's output) as ***. To read the chain's names, run
          # `pkgutil --check-signature` on the released asset.
          pkgutil --check-signature "$pkg" | tee "$RUNNER_TEMP/pkg-signature.txt"
          certificates=$(grep -cE '^ +[0-9]+\. ' "$RUNNER_TEMP/pkg-signature.txt" || true)
          leaf=$(sed -n 's/^ *1\. //p' "$RUNNER_TEMP/pkg-signature.txt")
          if [ "$certificates" != 3 ] || [ "$leaf" != "$IDENTITY" ]; then
            echo "::error::$pkg is not signed by MACOS_INSTALLER_SIGN_IDENTITY with a chain of three certificates (found $certificates)"
            exit 1
          fi
          # The AutoPkg recipe pins the chain by name, and administrators cannot take an edit to it
          # without reviewing it, so a certificate with another name must stop here, not in their
          # runs after the release.
          python3 -I "$GITHUB_WORKSPACE/autopkg/test_recipes.py" --authority-names > "$RUNNER_TEMP/recipe-names.txt"
          sed -nE 's/^ +[0-9]+\. //p' "$RUNNER_TEMP/pkg-signature.txt" > "$RUNNER_TEMP/pkg-names.txt"
          if ! diff "$RUNNER_TEMP/recipe-names.txt" "$RUNNER_TEMP/pkg-names.txt"; then
            echo "::error::the signer chain of $pkg is not expected_authority_names in autopkg/Skillcask.download.recipe.yaml; every administrator's recipe would refuse it. Nothing was attached"
            exit 1
          fi
          spctl --assess --type install -vv "$pkg" 2>&1 | tee "$RUNNER_TEMP/pkg-spctl.txt"
          grep -qxF "$pkg: accepted" "$RUNNER_TEMP/pkg-spctl.txt"
          grep -qx 'source=Notarized Developer ID' "$RUNNER_TEMP/pkg-spctl.txt"
          # After the staple, which changes the file. A relative name, like the zip's checksum.
          shasum -a 256 -b "$pkg" > "$pkg.sha256"
      # The runner is thrown away afterwards, so the package is really installed. The installed app
      # must then be the released one: the same code directory hash for each slice. That hash
      # covers the sealed resources and the helper, check-pkg.sh verified the app with --strict and
      # found /usr/local/bin/skillcask to be a link to that helper, so the command is the released
      # CLI too.
      - name: Check and install the package
        if: steps.state.outputs.state != 'complete'
        run: |
          macos/Scripts/check-pkg.sh "$PKG_DIR/Skillcask-${TAG#v}-macos-universal.pkg" --install
          for arch in arm64 x86_64; do
            installed=$(codesign -dvvv --arch "$arch" /Applications/Skillcask.app 2>&1 | sed -n 's/^CDHash=//p')
            released=$(codesign -dvvv --arch "$arch" "$RUNNER_TEMP/app/Skillcask.app" 2>&1 | sed -n 's/^CDHash=//p')
            if [ -z "$installed" ] || [ "$installed" != "$released" ]; then
              echo "::error::the installed Skillcask.app ($arch: ${installed:-no CDHash}) is not the released app (${released:-no CDHash})"
              exit 1
            fi
          done
          echo "installed app is the released app (CDHash per slice)"
      # The package first, the checksum in a second upload: both on the release means complete.
      # Without --clobber an upload fails when the release already has an asset of that name.
      - name: Attach to the release
        if: steps.state.outputs.state != 'complete'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.state.outputs.state }}
        run: |
          cd "$PKG_DIR"
          pkg="Skillcask-${TAG#v}-macos-universal.pkg"
          if [ "$STATE" = build ]; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$pkg"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$pkg.sha256"
      - name: Remove the keychain and the API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/installer.keychain-db" || true
          rm -f "$RUNNER_TEMP/key.p8" "$RUNNER_TEMP/installer.p12"

  # Hand edit: the cask skillcask-app in the tap, for the zip publish-macos-app attached. No signing
  # secrets here. It waits for the formula job because both push to the tap.
  publish-homebrew-cask:
    needs:
      - plan
      - publish-homebrew-formula
      - publish-macos-app
    runs-on: "ubuntu-22.04"
    permissions:
      "contents": "read"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          repository: "GetResponse/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Commit the cask
        run: |
          version="${TAG#v}"
          zip="Skillcask-$version-macos-universal.zip"
          sha256=$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$zip.sha256" --output - | cut -d ' ' -f 1)
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p Casks
          cat > Casks/skillcask-app.rb <<EOF
          cask "skillcask-app" do
            version "$version"
            sha256 "$sha256"

            url "https://github.com/GetResponse/skillcask/releases/download/v#{version}/Skillcask-#{version}-macos-universal.zip"
            name "Skillcask"
            desc "Desktop app for the skillcask package manager for agent skills"
            homepage "https://github.com/GetResponse/skillcask"

            depends_on formula: "getresponse/tap/skillcask"
            depends_on macos: :sonoma

            app "Skillcask.app"

            zap trash: [
              "~/Library/Preferences/io.github.puniserv.skillcask.plist",
              "~/Library/Saved Application State/io.github.puniserv.skillcask.savedState",
            ]
          end
          EOF
          git config --global user.name "axo bot"
          git config --global user.email "admin+bot@axo.dev"
          git add Casks/skillcask-app.rb
          git commit -m "skillcask-app $version"
          git push

  announce:
    needs:
      - plan
      - host
      - publish-homebrew-formula
      - publish-npm
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-homebrew-formula.result == 'skipped' || needs.publish-homebrew-formula.result == 'success') && (needs.publish-npm.result == 'skipped' || needs.publish-npm.result == 'success') }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
